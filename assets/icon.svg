<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ui-for-people">
  <title>ui-for-people</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241A4A"/>
      <stop offset="0.55" stop-color="#18123A"/>
      <stop offset="1" stop-color="#0F0C26"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.72" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#8B6DFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8B6DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arco" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#C79BFF"/>
      <stop offset="1" stop-color="#FFD5A1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9C2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9C2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- lienzo -->
  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>
  <rect width="64" height="64" rx="14" fill="url(#luz)"/>

  <g transform="translate(-1.35, 7.35)">
  <!-- el recorrido ya hecho: progreso que sube -->
  <path d="M 12.3 39.47 A 20 20 0 0 1 43.47 19.62"
        fill="none" stroke="url(#arco)" stroke-width="7" stroke-linecap="round"/>

  <!-- el momento presente: el toque -->
  <circle cx="43.47" cy="19.62" r="9.5" fill="url(#halo)"/>
  <circle cx="43.47" cy="19.62" r="5.1" fill="#FFF3DA"/>

  <!-- la respuesta: dos ecos que no gritan -->
  <path d="M 51.93 16.54 A 9 9 0 0 0 46.55 11.16"
        fill="none" stroke="#FFF3DA" stroke-opacity="0.72" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 55.69 15.17 A 13 13 0 0 0 47.92 7.40"
        fill="none" stroke="#FFF3DA" stroke-opacity="0.34" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
